services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: uget_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uget
      POSTGRES_USER: uget_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uget_dev_strong_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - uget_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: uget_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - uget_redisdata:/data

volumes:
  uget_pgdata:
  uget_redisdata:
